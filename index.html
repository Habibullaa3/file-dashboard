<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Drive bilan ishlash</title>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <button id="authorize_button">Kirish</button>
  <button id="signout_button">Chiqish</button>
  <button onclick="createFolder()">Papka yaratish</button>
  <input type="file" id="file_input">
  <button onclick="uploadFile()">Fayl yuklash</button>

<script>
const CLIENT_ID = '305062493209-fj4sldd0jp6qigrtk0bqmgjopj35ia98.apps.googleusercontent.com';
const API_KEY = 'AIzaSyAcsuttT9fpZGKqN95R7NEhjp0dw8zYj2w';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';

let gapiInited = false;
let gisInited = false;

function handleClientLoad() {
  gapi.load('client:auth2', initClient);
}

function initClient() {
  gapi.client.init({
    apiKey: API_KEY,
    clientId: CLIENT_ID,
    scope: SCOPES,
    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]
  }).then(() => {
    const authInstance = gapi.auth2.getAuthInstance();
    document.getElementById('authorize_button').onclick = () => authInstance.signIn();
    document.getElementById('signout_button').onclick = () => authInstance.signOut();
  });
}

function createFolder() {
  gapi.client.drive.files.create({
    resource: {
      name: "Yangi_Papka",
      mimeType: "application/vnd.google-apps.folder"
    },
    fields: "id"
  }).then(function(response) {
    alert("Papka yaratildi! ID: " + response.result.id);
  });
}

function uploadFile() {
  const file = document.getElementById('file_input').files[0];
  const metadata = {
    name: file.name,
    mimeType: file.type
  };

  const accessToken = gapi.auth.getToken().access_token;
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);

  fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: new Headers({ "Authorization": "Bearer " + accessToken }),
    body: form,
  }).then((res) => res.json()).then((val) => {
    alert("Yuklandi! Fayl ID: " + val.id);
  });
}

handleClientLoad();
</script>
</body>
</html>
