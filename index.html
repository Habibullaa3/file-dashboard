<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Google Drive papka fayllari</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin: 5px; padding: 10px; }
    h3 { margin-top: 30px; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h2>📂 Google Drive papkalardagi fayllar</h2>
  <button id="authorize_button" style="display:none;">🔐 Google orqali kirish</button>
  <button id="signout_button" onclick="signOut()" style="display:none;">🚪 Chiqish</button>

  <div id="file_lists"></div>

<script>
const CLIENT_ID = '305062493209-fj4sldd0jp6qigrtk0bqmgjopj35ia98.apps.googleusercontent.com';
const API_KEY = 'AIzaSyAcsuttT9fpZGKqN95R7NEhjp0dw8zYj2w';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

// Papkalar IDlari
const FOLDER_IDS = {
  'PPR akt': '1WO4U7BGGjJhosIVCM6aGTdmIjguvz-gt',
  'OFFICE MEMO': '1-CSlLATsyI0X0_RHSe1mubgA5foj3dZm',
  'ACTS': '1x4gtK0c5aeyZ6NFSyJIvyXRd7TXkiqOx'
};

let tokenClient;
let gapiInited = false;
let gisInited = false;

// GAPI yuklangach
function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: API_KEY,
    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
  });
  gapiInited = true;
  maybeEnableButtons();
}

// GIS (Google Identity Service) yuklangach
function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: '', // pastda belgilanadi
  });
  gisInited = true;
  maybeEnableButtons();
}

// Kirish tugmasi chiqsin
function maybeEnableButtons() {
  if (gapiInited && gisInited) {
    document.getElementById('authorize_button').style.display = 'block';
    document.getElementById('authorize_button').onclick = () => {
      tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
          throw (resp);
        }
        document.getElementById('signout_button').style.display = 'block';
        await listAllFolders(); // Kirgach papkalarni chiqar
      };
      tokenClient.requestAccessToken();
    };
  }
}

// Hisobdan chiqish
function signOut() {
  google.accounts.oauth2.revoke(gapi.auth.getToken().access_token, () => {
    document.getElementById('signout_button').style.display = 'none';
    document.getElementById('file_lists').innerHTML = '';
    alert("Hisobdan chiqildi");
  });
}

// Fayllarni papka ichidan olish
async function listFilesInFolder(folderId) {
  const res = await gapi.client.drive.files.list({
    q: `'${folderId}' in parents and trashed = false`,
    fields: "files(id, name, webViewLink)",
  });
  return res.result.files;
}

// Har bir papkadan fayllarni chiqarish
async function listAllFolders() {
  const container = document.getElementById('file_lists');
  container.innerHTML = '';

  for (const [folderName, folderId] of Object.entries(FOLDER_IDS)) {
    const files = await listFilesInFolder(folderId);

    const section = document.createElement('div');
    const title = document.createElement('h3');
    title.textContent = `📁 ${folderName}`;
    section.appendChild(title);

    const list = document.createElement('ul');
    if (files.length === 0) {
      const li = document.createElement('li');
      li.textContent = '📭 Fayl yo‘q';
      list.appendChild(li);
    } else {
      files.forEach(file => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = file.webViewLink;
        a.target = '_blank';
        a.textContent = file.name;
        li.appendChild(a);
        list.appendChild(li);
      });
    }

    section.appendChild(list);
    container.appendChild(section);
  }
}

window.onload = () => {
  gapiLoaded();
  gisLoaded();
};
</script>
</body>
</html>
