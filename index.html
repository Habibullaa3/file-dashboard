<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Google Drive bilan ishlash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    button { margin: 5px; padding: 10px; }
    input[type="file"] { margin: 10px 0; }
  </style>
</head>
<body>
  <h2>Google Drive ilovasi</h2>
  <button id="authorize_button" style="display:none;">Google orqali kirish</button>
  <button id="signout_button" onclick="signOut()" style="display:none;">Chiqish</button>
  <br><br>

  <button onclick="createFolder()">📁 Papka yaratish</button><br><br>

  <input type="file" id="file_input">
  <button onclick="uploadFile()">⬆️ Fayl yuklash</button>

<script>
const CLIENT_ID = '305062493209-fj4sldd0jp6qigrtk0bqmgjopj35ia98.apps.googleusercontent.com';
const API_KEY = 'AIzaSyAcsuttT9fpZGKqN95R7NEhjp0dw8zYj2w';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';

let tokenClient;
let gapiInited = false;
let gisInited = false;

document.getElementById('authorize_button').style.display = 'none';
document.getElementById('signout_button').style.display = 'none';

function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: API_KEY,
    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
  });
  gapiInited = true;
  maybeEnableButtons();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: '', // callback quyida token olayotganda aniqlanadi
  });
  gisInited = true;
  maybeEnableButtons();
}

function maybeEnableButtons() {
  if (gapiInited && gisInited) {
    document.getElementById('authorize_button').style.display = 'block';
    document.getElementById('authorize_button').onclick = () => {
      tokenClient.callback = (resp) => {
        if (resp.error !== undefined) {
          throw (resp);
        }
        document.getElementById('signout_button').style.display = 'block';
        alert("Kirish muvaffaqiyatli!");
      };
      tokenClient.requestAccessToken();
    };
  }
}

function signOut() {
  google.accounts.oauth2.revoke(gapi.auth.getToken().access_token, () => {
    alert("Chiqildi");
    document.getElementById('signout_button').style.display = 'none';
  });
}

// PAPKA YARATISH
function createFolder() {
  const folderMetadata = {
    name: "Yangi_Papka_" + new Date().toISOString(),
    mimeType: "application/vnd.google-apps.folder"
  };

  gapi.client.drive.files.create({
    resource: folderMetadata,
    fields: 'id'
  }).then(function(response) {
    alert("Papka yaratildi. ID: " + response.result.id);
  });
}

// FAYL YUKLASH
function uploadFile() {
  const fileInput = document.getElementById("file_input");
  if (fileInput.files.length === 0) {
    alert("Fayl tanlanmadi.");
    return;
  }

  const file = fileInput.files[0];
  const metadata = {
    name: file.name,
    mimeType: file.type
  };

  const accessToken = gapi.auth.getToken().access_token;
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);

  fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: new Headers({ "Authorization": "Bearer " + accessToken }),
    body: form,
  }).then((res) => res.json()).then((val) => {
    alert("Yuklash muvaffaqiyatli! Fayl ID: " + val.id);
  });
}

// Yuklashni boshlash
window.onload = () => {
  gapiLoaded();
  gisLoaded();
};
</script>
</body>
</html>
