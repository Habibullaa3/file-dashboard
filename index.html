<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Google Drive papkalar</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; }
    button { margin: 10px; padding: 10px; }
    ul { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>📂 Mening Google Drive papkalarim</h2>
  <button id="authorize_button" style="display:none;">🔐 Google orqali kirish</button>
  <button id="signout_button" onclick="signOut()" style="display:none;">🚪 Chiqish</button>

  <ul id="folder_list"></ul>

<script>
const CLIENT_ID = '305062493209-fj4sldd0jp6qigrtk0bqmgjopj35ia98.apps.googleusercontent.com';
const API_KEY = 'AIzaSyAcsuttT9fpZGKqN95R7NEhjp0dw8zYj2w';
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

const FOLDER_IDS = {
  'PPR akt': '1WO4U7BGGjJhosIVCM6aGTdmIjguvz-gt',
  'OFFICE MEMO': '1-CSlLATsyI0X0_RHSe1mubgA5foj3dZm',
  'ACTS': '1x4gtK0c5aeyZ6NFSyJIvyXRd7TXkiqOx'
};

let tokenClient;
let gapiInited = false;
let gisInited = false;

function gapiLoaded() {
  gapi.load('client', initializeGapiClient);
}

async function initializeGapiClient() {
  await gapi.client.init({
    apiKey: API_KEY,
    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"],
  });
  gapiInited = true;
  maybeEnableButtons();
}

function gisLoaded() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: '', // belgilaymiz pastda
  });
  gisInited = true;
  maybeEnableButtons();
}

function maybeEnableButtons() {
  if (gapiInited && gisInited) {
    document.getElementById('authorize_button').style.display = 'block';
    document.getElementById('authorize_button').onclick = () => {
      tokenClient.callback = (resp) => {
        if (resp.error !== undefined) {
          throw (resp);
        }
        document.getElementById('signout_button').style.display = 'block';
        showFolderLinks();
      };
      tokenClient.requestAccessToken();
    };
  }
}

function signOut() {
  google.accounts.oauth2.revoke(gapi.auth.getToken().access_token, () => {
    alert("Hisobdan chiqildi.");
    document.getElementById('signout_button').style.display = 'none';
    document.getElementById('folder_list').innerHTML = '';
  });
}

function showFolderLinks() {
  const ul = document.getElementById("folder_list");
  ul.innerHTML = '';

  for (const [name, id] of Object.entries(FOLDER_IDS)) {
    const li = document.createElement("li");
    const link = document.createElement("a");
    link.href = `https://drive.google.com/drive/folders/${id}`;
    link.target = "_blank";
    link.innerText = name;
    li.appendChild(link);
    ul.appendChild(li);
  }
}

window.onload = () => {
  gapiLoaded();
  gisLoaded();
};
</script>
</body>
</html>
