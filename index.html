<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>Google Drive Fayl Menejeri</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h1>Google Drive Fayl Menejeri</h1>
  <button id="authorize_button">Kirish</button>
  <button id="signout_button">Chiqish</button>
  <div id="content" style="display: none;">
    <select id="folder_select">
      <option value="FOLDER_ID_ACTS">ACTS</option>
      <option value="FOLDER_ID_OFFICE_MEMO">OFFICE MEMO</option>
      <option value="FOLDER_ID_ACT_PPR">ACT PPR</option>
    </select>
    <input type="file" id="file_input" />
    <button id="upload_button">Yuklash</button>
    <input type="text" id="search_input" placeholder="Fayl nomi bo‘yicha izlash" />
    <ul id="file_list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
